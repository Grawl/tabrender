# Run with prek (npm devDependency): `npx prek install` once, then hooks run on every commit.
# Every hook calls this repo's own tooling: ruff (brew install ruff / pip install ruff) and the npm packages.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: oxlint
        name: oxlint
        entry: npx --no oxlint
        language: system
        types_or: [javascript, ts, jsx, tsx]
        pass_filenames: false
      - id: oxfmt
        name: oxfmt
        entry: npx --no oxfmt
        language: system
        types_or: [javascript, ts, json, yaml, html, css, markdown]
        pass_filenames: false
      - id: markdownlint
        name: markdownlint
        entry: npx --no markdownlint-cli2 --fix
        language: system
        types: [markdown]
        pass_filenames: false
