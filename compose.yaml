services:
  app:
    image: louislam/its-mytabs:1
    container_name: its-mytabs
    ports:
      - "127.0.0.1:47777:47777"
    volumes:
      - ./data:/app/data
      # Replace bundled sonivox.sf2 (1.3 MB) with a high-quality GM bank.
      # Swap the left side to ./soundfont/GeneralUser_GS.sf2 for a lighter (~30 MB) bank. alphaTab drops stereo samples (presets go silent/NaN), so FluidR3 is patched to mono via soundfont/sf2mono.py.
      - ./soundfont/FluidR3_GM_mono.sf2:/app/dist/soundfont/sonivox.sf2:ro
    restart: unless-stopped

  render:
    # Renders every tab in ./data/tabs to render.mp3 (DI samples + amp sim); It's MyTabs picks the file up as audio.
    build: ./render
    container_name: its-mytabs-render
    volumes:
      - ./data:/data
      - ./render/assets:/assets:ro
      - ./soundfont:/soundfont:ro
      - ./rclone:/rclone:ro   # rclone.conf with the "dropbox" remote (see render/README.md)
    environment:
      TABRENDER_SOUNDFONT: /soundfont/FluidR3_GM_mono.sf2
      # Dropbox folder to mirror into tabs (<Band>/<Song>.gp); empty = disabled (set in compose.server.yaml)
      TABRENDER_DROPBOX_REMOTE: ""
      TABRENDER_DROPBOX_PUBLIC: "1"   # imported tabs are public (shareable without login)
    restart: unless-stopped
