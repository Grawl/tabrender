# tabs.example.com -> It's MyTabs container (stack "tabs", attached to proxy_default network).
# nginx-certbot obtains the certificate for this server_name automatically.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tabs.example.com;

    ssl_certificate         /etc/letsencrypt/live/tabs.example.com/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/tabs.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/tabs.example.com/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    client_max_body_size 0;      # tab + audio uploads
    proxy_read_timeout  600;     # long-running separate/render requests, websocket idle
    proxy_send_timeout  600;
    proxy_buffering     off;     # audio range requests stream through

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $tabs_upstream http://its-mytabs:47777;

    # The soundfont is a large static blob: let browsers keep it.
    location /soundfont/ {
        proxy_pass $tabs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }


    # ---- read-only band instance under /band-a/ (prefix stripped; see compose.server.yaml) ----
    set $band-a_upstream http://its-mytabs-band-a:47777;
    location = /band-a { return 301 /band-a/; }
    location = /band-a/register { return 403; }
    location /band-a/api/auth/ {
        rewrite ^/band-a/(.*)$ /$1 break;
        proxy_cookie_path / /band-a/;   # keep this instance's session cookie away from / and the other instance
        proxy_pass $band-a_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /band-a/api/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/band-a/(.*)$ /$1 break;
        proxy_pass $band-a_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /band-a/soundfont/ {
        rewrite ^/band-a/(.*)$ /$1 break;
        proxy_pass $band-a_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /band-a/ {
        rewrite ^/band-a/(.*)$ /$1 break;
        proxy_pass $band-a_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    # ---- read-only band instance under /band-b/ (prefix stripped; see compose.server.yaml) ----
    set $band_b_upstream http://its-mytabs-band-b:47777;
    location = /band-b { return 301 /band-b/; }
    location = /band-b/register { return 403; }
    location /band-b/api/auth/ {
        rewrite ^/band-b/(.*)$ /$1 break;
        proxy_cookie_path / /band-b/;   # keep this instance's session cookie away from / and the other instance
        proxy_pass $band_b_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /band-b/api/ {
        limit_except GET HEAD { deny all; }
        rewrite ^/band-b/(.*)$ /$1 break;
        proxy_pass $band_b_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /band-b/soundfont/ {
        rewrite ^/band-b/(.*)$ /$1 break;
        proxy_pass $band_b_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /band-b/ {
        rewrite ^/band-b/(.*)$ /$1 break;
        proxy_pass $band_b_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }

    location / {
        proxy_pass $tabs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
